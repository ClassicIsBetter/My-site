<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>classics site</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f1115;
            color: #fff;
        }

        header {
            text-align: center;
            padding: 35px 20px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        header p {
            color: #888;
        }

        .games {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        .game {
            background: #181b21;
            border: 1px solid #252932;
            border-radius: 14px;
            padding: 20px;
            text-align: center;
        }

        canvas {
            display: block;
            margin: 15px auto;
            background: #090b0e;
            border: 1px solid #30343d;
            border-radius: 8px;
            max-width: 100%;
        }

        .score {
            font-size: 24px;
            margin: 10px;
        }

        .info {
            color: #888;
            font-size: 14px;
        }

        button {
            border: 1px solid #30343d;
            background: #181b21;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #242831;
        }
    </style>
</head>

<body>

<header>
    <h1>Mini Games</h1>
    <p>Pick a game and have fun.</p>
</header>

<div class="games">

    <div class="game">
        <h2>Snake</h2>

        <div class="score">
            Score: <span id="snakeScore">0</span>
        </div>

        <canvas id="snakeCanvas" width="400" height="400"></canvas>

        <p class="info">
            Use the arrow keys or WASD to move.
        </p>

        <button onclick="startSnake()">Restart</button>
    </div>

</div>

<script>
    const canvas = document.getElementById("snakeCanvas");
    const ctx = canvas.getContext("2d");

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake;
    let food;
    let direction;
    let nextDirection;
    let score = 0;
    let gameLoop;

    function startSnake() {
        clearInterval(gameLoop);

        snake = [
            { x: 10, y: 10 }
        ];

        direction = {
            x: 1,
            y: 0
        };

        nextDirection = {
            x: 1,
            y: 0
        };

        score = 0;

        document.getElementById("snakeScore").textContent = score;

        spawnFood();

        gameLoop = setInterval(updateSnake, 100);
    }

    function updateSnake() {
        direction = nextDirection;

        const head = {
            x: snake[0].x + direction.x,
            y: snake[0].y + direction.y
        };

        // Wall collision
        if (
            head.x < 0 ||
            head.x >= tileCount ||
            head.y < 0 ||
            head.y >= tileCount
        ) {
            gameOver();
            return;
        }

        // Self collision
        for (let part of snake) {
            if (
                head.x === part.x &&
                head.y === part.y
            ) {
                gameOver();
                return;
            }
        }

        snake.unshift(head);

        // Food collision
        if (
            head.x === food.x &&
            head.y === food.y
        ) {
            score++;

            document.getElementById("snakeScore").textContent = score;

            spawnFood();
        } else {
            snake.pop();
        }

        drawSnake();
    }

    function spawnFood() {
        food = {
            x: Math.floor(Math.random() * tileCount),
            y: Math.floor(Math.random() * tileCount)
        };
    }

    function drawSnake() {
        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        // Food
        ctx.fillStyle = "#ff4d6d";

        ctx.fillRect(
            food.x * gridSize,
            food.y * gridSize,
            gridSize,
            gridSize
        );

        // Snake
        ctx.fillStyle = "#4ade80";

        snake.forEach(part => {
            ctx.fillRect(
                part.x * gridSize,
                part.y * gridSize,
                gridSize - 2,
                gridSize - 2
            );
        });
    }

    function gameOver() {
        clearInterval(gameLoop);

        setTimeout(() => {
            alert("Game over! Score: " + score);
        }, 50);
    }

    document.addEventListener("keydown", event => {
        const key = event.key.toLowerCase();

        if (
            (event.key === "ArrowUp" || key === "w") &&
            direction.y !== 1
        ) {
            nextDirection = { x: 0, y: -1 };
        }

        if (
            (event.key === "ArrowDown" || key === "s") &&
            direction.y !== -1
        ) {
            nextDirection = { x: 0, y: 1 };
        }

        if (
            (event.key === "ArrowLeft" || key === "a") &&
            direction.x !== 1
        ) {
            nextDirection = { x: -1, y: 0 };
        }

        if (
            (event.key === "ArrowRight" || key === "d") &&
            direction.x !== -1
        ) {
            nextDirection = { x: 1, y: 0 };
        }
    });

    startSnake();
</script>

</body>
</html>

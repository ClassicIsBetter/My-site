<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Classics site</title>

    <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f1115;
        color: #f1f1f1;
    }

    header {
        text-align: center;
        padding: 50px 20px 30px;
    }

    header h1 {
        margin: 0;
        font-size: 40px;
    }

    header p {
        color: #8b8f98;
        margin-top: 10px;
    }

    .links {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 15px;
    }

    .link {
        display: flex;
        align-items: center;
        gap: 12px;

        padding: 12px;

        background: #181b21;
        border: 1px solid #252932;
        border-radius: 12px;

        text-decoration: none;
        color: inherit;

        transition: 0.2s;
    }

    .link:hover {
        transform: translateY(-3px);
        background: #1d2027;
        border-color: #353a45;
    }

    .link img {
        width: 55px;
        height: 55px;
        object-fit: cover;
        border-radius: 10px;
        flex-shrink: 0;
    }

    .link-content {
        padding: 0;
    }

    .link-content h2 {
        margin: 0 0 4px;
        font-size: 18px;
    }

    .link-content p {
        margin: 0;
        color: #8b8f98;
        font-size: 14px;
    }

    footer {
        text-align: center;
        padding: 40px 20px;
        color: #666b75;
    }
</style>
</head>

<body>

    <header>
        <h1>my site</h1>
        <p>i update it every once in awhile</p>
    </header>

    <main class="links" id="links"></main>

    <footer>
        © 2026 My Site
    </footer>

    <script>
        // =========================
        // ADD YOUR LINKS HERE
        // =========================

        const links = [
            {
                name: "Discord",
                description: "Join my Discord server",
                url: "https://classicisbetter.github.io/discord",
                image: "images/discord.svg"
            },

            {
                name: "Games",
                description: "Look at some cool mini games i made",
                url: "https://classicisbetter.github.io/games",
                image: "images/games.png"
            },

            // Add more like this:
            //
            // {
            //     name: "My Project",
            //     description: "A cool project I made",
            //     url: "https://example.com",
            //     image: "images/project.png"
            // }
        ];

        // =========================
        // DON'T NEED TO EDIT BELOW
        // =========================

        const container = document.getElementById("links");

        links.forEach(link => {
            const element = document.createElement("a");

            element.className = "link";
            element.href = link.url;
            element.target = "_blank";
            element.rel = "noopener noreferrer";

            element.innerHTML = `
                <img src="${link.image}" alt="${link.name}">
                <div class="link-content">
                    <h2>${link.name}</h2>
                    <p>${link.description}</p>
                </div>
            `;

            container.appendChild(element);
        });
    </script>

</body>
</html>

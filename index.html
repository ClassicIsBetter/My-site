<!DOCTYPE html>
<html>
<head>
    <title>classics page</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        p {
            font-size: 24px;
        }

        img {
            display: block;
            max-width: 500px;
            max-height: 400px;
            margin: 20px 0;
            border-radius: 8px;
        }

        a {
            display: block;
            color: white;
            text-decoration: none;
            font-size: 20px;
            margin: 15px 0;
            transition: transform 0.2s;
        }

        a:hover {
            transform: translateX(10px);
        }
    </style>
</head>

<body>

    <p>this is my site</p>

    <img id="randomImage">

    <script>
        const images = [
            "images/1.png",
            "images/2.png",
            "images/3.png",
            "images/4.jpg"
        ];

        const randomImage = images[Math.floor(Math.random() * images.length)];

        document.getElementById("randomImage").src = randomImage;
    </script>

    <a href="https://discord.gg/4UczSaa4AJ">> Discord</a>
    <a href="#">> Link 2</a>
    <a href="#">> Link 3</a>
    <a href="#">> Link 4</a>

</body>
</html>
